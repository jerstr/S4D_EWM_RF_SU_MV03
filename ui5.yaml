specVersion: "2.4"
metadata:
  name: ewm.s4m.s4d_ewm_rf_sb_move03.s4d_ewm_rf_su_mv03
type: application
server:
  customMiddleware:
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        ignoreCertError: false
        backend:
          - path: /sap
            url: ""
            client: "100"
            destination: S4D_100
        ui5:
          path:
            - /resources
            - /test-resources
          url: https://ui5.sap.com
          version: 1.71.11
    - name: fiori-tools-appreload
      afterMiddleware: compression
      configuration:
        port: 35729
        path: webapp
